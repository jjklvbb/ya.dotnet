services:
  users-db:
    image: postgres:16-alpine
    container_name: users-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usersdb
    ports:
      - "5433:5432"
    volumes:
      - users_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usersdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  users-api:
    build:
      context: .
      dockerfile: src/Services/Users/Users.Api/Dockerfile
    container_name: users-api
    ports:
      - "5101:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__UsersDb: "Host=users-db;Port=5432;Database=usersdb;Username=postgres;Password=postgres"
      Jwt__Issuer: EventApi
      Jwt__Audience: EventApiClient
      Jwt__LifetimeMinutes: 30
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      users-db:
        condition: service_healthy
        
  events-db:
    image: postgres:16-alpine
    container_name: events-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventsdb
    ports:
      - "5434:5432"
    volumes:
      - events_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventsdb"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  events-api:
    build:
      context: .
      dockerfile: src/Services/Events/Events.Api/Dockerfile
    container_name: events-api
    ports:
      - "5102:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__EventsDb: "Host=events-db;Port=5432;Database=eventsdb;Username=postgres;Password=postgres"
      Jwt__Issuer: EventApi
      Jwt__Audience: EventApiClient
      Jwt__LifetimeMinutes: 30
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Kafka__BootstrapServers: kafka:29092
      Kafka__ConsumerGroup: events-booking-consumer
      Redis__ConnectionString: redis:6379
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
        
  bookings-db:
    image: postgres:16-alpine
    container_name: bookings-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookingsdb
    ports:
      - "5435:5432"
    volumes:
      - bookings_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookingsdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  bookings-api:
    build:
      context: .
      dockerfile: src/Services/Bookings/Bookings.Api/Dockerfile
    container_name: bookings-api
    ports:
      - "5103:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BookingsDb: "Host=bookings-db;Port=5432;Database=bookingsdb;Username=postgres;Password=postgres"
      Jwt__Issuer: EventApi
      Jwt__Audience: EventApiClient
      Jwt__LifetimeMinutes: 30
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Kafka__BootstrapServers: kafka:29092
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
        
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test:
        - CMD-SHELL
        - "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: eventapi-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  users_pgdata:
  events_pgdata:
  bookings_pgdata: